---
- hosts: webserver
  become: yes
  gather_facts: yes

  tasks: 
    - name: create a file
      ansible.builtin.file:
         path: /home/maha/newfile.txt
         state: touch
         mode: '0644'
      when: ansible_os_family == "Debian"
    
    - name: create a file
      ansible.builtin.file:
         path: /home/maha/newfile.txt
         state: touch
         mode: '0644'
      when: ansible_os_family == "RedHat"

    - name: copy the static file master to "Debian" debian node
      ansible.builtin.copy:
        src: staticfile
        dest: /home/maha/
      when: ansible_os_family == "Debian"

    - name: copy the static file master to "RedHat" node
        ansible.builtin.copy:
        src: staticfile
        dest: /home/maha/
      when: ansible_os_family == "RedHat"

    - name: copy the dynamic file master to "Debian" debian node
      ansible.builtin.template:
        src: dynamic.j2
        dest: /var/www/html/index.html
      when: ansible_os_family == "Debian"

    - name: copy the dynamic file master to "RedHat" node
      ansible.builtin.template:
        src: dynamic.j2
        dest: /var/www/html/index.html
      when: ansible_os_family == "RedHat"

    - name: download a file from internet
      ansible.builtin.get_url:
           src: https://www.magnific.com/free-photos-vectors/devops
           dest: /home/maha/
           force_basic_auth: yes
      when: ansible_os_family == "Debian"

    - name: download a file from internet
      ansible.builtin.get_url:
           src: https://www.magnific.com/free-photos-vectors/devops
           dest: /home/maha/
           force_basic_auth: yes
      when: ansible_os_family == "RedHat"